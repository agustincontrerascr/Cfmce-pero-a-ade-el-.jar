name: Compilar mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Compilar
        shell: bash
        run: |
          set -o pipefail
          ls -la
          for z in CFMCE*.zip; do unzip -q -o "$z" -d "x_$z"; done
          F=$(find . -path '*CFMCE-1.12.2/src/main/java/*MrCrayfishFurnitureModCE.java' | head -1)
          if [ -z "$F" ]; then echo "NO ENCONTRE el proyecto. Sube el archivo CFMCE-1.12.2.zip"; exit 1; fi
          P="${F%%/src/*}"
          echo "PROJ=$P" >> "$GITHUB_ENV"
          cd "$P"
          chmod +x gradlew
          ./gradlew build --no-daemon --stacktrace 2>&1 | tee "$GITHUB_WORKSPACE/build-log.txt"
      - name: Subir el mod
        uses: actions/upload-artifact@v4
        with:
          name: CFMCE-jar
          path: ${{ env.PROJ }}/build/libs/*.jar
          if-no-files-found: ignore
      - name: Subir el registro de errores
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: log-de-errores
          path: build-log.txt
          if-no-files-found: ignore
