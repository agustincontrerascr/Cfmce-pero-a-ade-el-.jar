name: Build MrCrayfish Furniture CE (Forge 1.8.9)

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Set up Gradle 2.14.1
        uses: gradle/gradle-build-action@v2
        with:
          gradle-version: 2.14.1

      - name: Build mod JAR
  run: gradle --no-daemon clean build
  working-directory: ./CFMCE-1.8.9-build

      - name: Upload compiled mod
        uses: actions/upload-artifact@v4
        with:
          name: MrCrayfishFurnitureCE-Forge-1.8.9
          path: CFMCE-1.8.9-build/build/libs/*.jar
          if-no-files-found: error
