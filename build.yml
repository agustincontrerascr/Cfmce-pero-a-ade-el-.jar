name: Construir mod
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Descomprimir y compilar
        run: |
          unzip -q FurnitureModels-1.12.2.zip
          cd FurnitureModels-1.12.2
          chmod +x gradlew
          ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FurnitureModels-jar
          path: FurnitureModels-1.12.2/build/libs/*.jar
